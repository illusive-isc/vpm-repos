name: Update Source Repos

# 公開リポジトリのうち、ルートに package.json があり zip 付きのリリースを持つものを集めて
# source.json の githubRepos を最新化する。変わっていれば commit して build-listing を起動する。
#
# 一覧に載せたくないものは、次のどれかで除外できる (どれか 1 つで足りる):
#   - source.json の "excludeRepos" に "owner/repo" を書く (既に載っていても外す)
#   - そのリポジトリの package.json に "private": true を書く
#   - そのリポジトリに GitHub の topic "no-vpm" を付ける
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  repository_dispatch:
    types: [package-released]

permissions:
  contents: write
  actions: write

concurrency:
  group: "update-source"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect public package repositories
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;

            // 末尾カンマなど緩い JSON も読めるようにしてから扱う
            const text = fs.readFileSync('source.json', 'utf8').replace(/,\s*([\]}])/g, '$1');
            const src = JSON.parse(text);
            const exclude = new Set((src.excludeRepos || []).map(s => s.toLowerCase()));

            // 組織でも個人でも動くように両方試す
            let repos;
            try {
              repos = await github.paginate(github.rest.repos.listForOrg, { org: owner, type: 'public', per_page: 100 });
            } catch (e) {
              repos = await github.paginate(github.rest.repos.listForUser, { username: owner, type: 'owner', per_page: 100 });
            }

            const found = [];
            const skipped = [];
            for (const r of repos) {
              if (r.private || r.archived || r.fork) continue;
              if (r.full_name === `${owner}/${context.repo.repo}`) continue;
              if (exclude.has(r.full_name.toLowerCase())) { skipped.push(`${r.full_name} (excludeRepos)`); continue; }
              if ((r.topics || []).includes('no-vpm')) { skipped.push(`${r.full_name} (topic no-vpm)`); continue; }

              // ルートの package.json (VPM パッケージの印)
              let pkg;
              try {
                const res = await github.rest.repos.getContent({ owner, repo: r.name, path: 'package.json' });
                pkg = JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf8'));
              } catch (e) {
                continue;
              }
              if (!pkg || !pkg.name || !pkg.version) continue;
              if (pkg.private === true) { skipped.push(`${r.full_name} (package.json private)`); continue; }

              // zip 付きのリリースが 1 つでもあるか (無いと一覧に載せても取れない)
              let releases = [];
              try {
                releases = (await github.rest.repos.listReleases({ owner, repo: r.name, per_page: 10 })).data;
              } catch (e) {}
              const hasZip = releases.some(x => (x.assets || []).some(a => a.name.endsWith('.zip')));
              if (!hasZip) {
                skipped.push(`${r.full_name} (zip 付きリリースなし)`);
                continue;
              }
              core.info(`${r.full_name}: ${pkg.name} ${pkg.version}`);
              found.push(r.full_name);
            }

            const before = JSON.stringify(src.githubRepos || []);
            const merged = new Set([...(src.githubRepos || []), ...found]);
            src.githubRepos = [...merged]
              .filter(name => !exclude.has(name.toLowerCase()))
              .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
            if (!Array.isArray(src.excludeRepos)) src.excludeRepos = [];
            fs.writeFileSync('source.json', JSON.stringify(src, null, 4) + '\n');

            const changed = before !== JSON.stringify(src.githubRepos);
            core.setOutput('changed', changed ? 'true' : 'false');
            core.summary.addHeading('githubRepos').addList(src.githubRepos);
            if (skipped.length) core.summary.addHeading('見送り').addList(skipped);
            await core.summary.write();

      - name: Commit source.json
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update githubRepos from public package repositories"
          git push

      # GITHUB_TOKEN による push は他のワークフローを起こさないので、一覧の再生成は明示的に頼む。
      # (リリース通知 (repository_dispatch) で来た場合は、リポジトリ一覧が変わらなくても
      #  新しい版を拾うために再生成する)
      - name: Rebuild listing
        if: steps.collect.outputs.changed == 'true' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-listing.yml --ref main
